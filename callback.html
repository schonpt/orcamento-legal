<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A regressar à aplicação…</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; color: #1a1a1a; background: #f5f5f7; }
  .card { max-width: 480px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 1.2rem; margin: 0 0 12px; }
  p { line-height: 1.45; }
  .btn { display: inline-block; margin-top: 12px; padding: 12px 18px; background: #2e7d32; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
  code { word-break: break-all; background: #f0f0f2; padding: 8px; border-radius: 6px; display: block; margin-top: 8px; font-size: .85rem; }
  details { margin-top: 16px; }
  button { margin-top: 8px; padding: 10px 14px; border: 1px solid #ccc; background: #fff; border-radius: 8px; font-size: .95rem; }
</style>
</head>
<body>
<div class="card">
  <h1>A regressar à aplicação…</h1>
  <p id="status">A abrir a aplicação KinMeld…</p>
  <a id="open" class="btn" href="#">Abrir KinMeld</a>
  <details id="manual">
    <summary>Não abriu? Copia o código</summary>
    <p>Cola este código na app, em <strong>“Já autorizei no banco”</strong>:</p>
    <code id="code">—</code>
    <button id="copy">Copiar código</button>
  </details>
</div>
<script>
(function () {
  var q = window.location.search || "";
  var params = new URLSearchParams(q);
  var code = params.get("code") || "";
  var error = params.get("error") || "";
  var errorDescription = params.get("error_description") || "";
  var deep = "financeapp://auth-callback" + q;
  var intent = "intent://auth-callback" + q + "#Intent;scheme=financeapp;end";
  var isAndroid = /Android/i.test(navigator.userAgent || "");
  var target = isAndroid ? intent : deep;

  var status = document.getElementById("status");
  var open = document.getElementById("open");
  var manual = document.getElementById("manual");
  var codeEl = document.getElementById("code");

  open.setAttribute("href", deep);
  if (code) codeEl.textContent = code;

  if (error) {
    status.textContent = errorDescription || ("Autorização recusada: " + error);
  } else if (!code) {
    status.textContent = "Não foi recebido nenhum código de autorização.";
  } else {
    window.location.href = target;
    setTimeout(function () {
      status.textContent = "Se a aplicação não abriu, toca em «Abrir KinMeld».";
      manual.open = true;
    }, 1500);
  }

  document.getElementById("copy").addEventListener("click", function () {
    var text = code || "";
    if (!text) return;
    var done = function () { document.getElementById("copy").textContent = "Copiado!"; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done);
    } else {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    }
  });
})();
</script>
</body>
</html>
